name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate package
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --ignore-platform-req=ext-getbiblesword

      - name: Unit tests
        run: composer test

      - name: Security audit
        if: matrix.php == '8.4'
        run: composer audit --no-interaction

      - name: Coding standard
        if: matrix.php == '8.4'
        run: composer style

      - name: Static analysis
        if: matrix.php == '8.4'
        run: composer analyse

  lowest:
    name: Lowest supported dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2

      - name: Resolve lowest supported dependencies
        run: >-
          composer update
          --no-interaction
          --prefer-lowest
          --prefer-stable
          --ignore-platform-req=ext-getbiblesword

      - name: Unit tests
        run: composer test

  coverage:
    name: Coverage inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          coverage: xdebug
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --ignore-platform-req=ext-getbiblesword

      - name: Build coverage report
        env:
          XDEBUG_MODE: coverage
        run: composer coverage

      - name: Build coverage inventory
        run: composer coverage-inventory

      - name: Retain coverage evidence
        if: always() && hashFiles('build/coverage*') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: build/coverage*
          if-no-files-found: error
          retention-days: 30

  distribution:
    name: Composer distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Build Composer archive
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          mkdir -p build/dist
          COMPOSER_ROOT_VERSION="$version" composer archive \
            --format=zip \
            --dir=build/dist \
            --file="getbible-scripture-${version}"

      - name: Install clean distribution
        shell: bash
        run: |
          set -euo pipefail
          archive="build/dist/getbible-scripture-$(tr -d '\r\n' < VERSION).zip"
          test -s "$archive"
          mkdir -p build/extracted
          unzip -q "$archive" -d build/extracted
          package_composer="$(
            find build/extracted -maxdepth 2 -type f -name composer.json \
              -print -quit
          )"
          test -n "$package_composer"
          package_root="$(dirname "$package_composer")"
          composer validate --strict --working-dir="$package_root"
          composer install \
            --working-dir="$package_root" \
            --no-dev \
            --no-interaction \
            --prefer-dist \
            --ignore-platform-req=ext-getbiblesword
          php -r '
              require $argv[1];
              exit(
                  interface_exists(
                      GetBible\Scripture\Service\ScriptureInterface::class
                  ) ? 0 : 1
              );
          ' "$package_root/vendor/autoload.php"

      - name: Retain package evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: composer-package-${{ github.sha }}
          path: build/dist/*
          if-no-files-found: error
          retention-days: 30

  integration:
    name: Released extension and CrossWire KJV
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf automake binutils build-essential cmake curl git \
            libbz2-dev libcurl4-openssl-dev libicu-dev liblzma-dev \
            libtool pkg-config unzip zlib1g-dev

      - name: Install published getbible/sword source through PIE
        shell: bash
        run: |
          set -euo pipefail
          sword_version="0.1.0"
          sword_archive="php_getbiblesword-${sword_version}-src.tgz"
          sword_release="https://github.com/getbible/sword/releases/download/v${sword_version}"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --retry 3 \
            --show-error \
            --silent \
            --tlsv1.2 \
            --output "$RUNNER_TEMP/pie.phar" \
            https://github.com/php/pie/releases/download/1.4.9/pie.phar
          echo \
            '19a31ddd4bfd08b9eb5eaad2e5f63e76e7919cae7683852da41c80da704ad6c0  '"$RUNNER_TEMP"'/pie.phar' \
            | sha256sum --check --strict
          curl \
            --fail \
            --location \
            --proto '=https' \
            --retry 3 \
            --show-error \
            --silent \
            --tlsv1.2 \
            --output "$RUNNER_TEMP/$sword_archive" \
            "$sword_release/$sword_archive"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --retry 3 \
            --show-error \
            --silent \
            --tlsv1.2 \
            --output "$RUNNER_TEMP/$sword_archive.sha256" \
            "$sword_release/$sword_archive.sha256"
          (
            cd "$RUNNER_TEMP"
            sha256sum --check --strict "$sword_archive.sha256"
          )
          mkdir -p "$RUNNER_TEMP/getbiblesword"
          tar \
            --extract \
            --gzip \
            --file "$RUNNER_TEMP/$sword_archive" \
            --directory "$RUNNER_TEMP/getbiblesword"
          sword_root="$RUNNER_TEMP/getbiblesword/php_getbiblesword-${sword_version}"
          test -f "$sword_root/composer.json"
          test -f "$sword_root/vendor/getbiblesword/src/c_api.cpp"
          php "$RUNNER_TEMP/pie.phar" repository:add path "$sword_root"
          php "$RUNNER_TEMP/pie.phar" install \
            --no-cache \
            'getbible/sword:*@dev'
          php --ri getbiblesword

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Download CrossWire KJV
        id: kjv
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sword"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --retry 3 \
            --show-error \
            --silent \
            --tlsv1.2 \
            --output "$RUNNER_TEMP/KJV.zip" \
            https://crosswire.org/ftpmirror/pub/sword/packages/rawzip/KJV.zip
          unzip -q "$RUNNER_TEMP/KJV.zip" -d "$RUNNER_TEMP/sword"
          test -f "$RUNNER_TEMP/sword/mods.d/kjv.conf"
          printf 'sha256=%s\n' \
            "$(sha256sum "$RUNNER_TEMP/KJV.zip" | cut -d' ' -f1)" \
            >> "$GITHUB_OUTPUT"

      - name: Run installed-module integration
        env:
          KJV_SOURCE_SHA256: ${{ steps.kjv.outputs.sha256 }}
        run: >-
          php scripts/integration-kjv.php
          "$RUNNER_TEMP/sword"
          "$RUNNER_TEMP/cache"
          "build/integration-evidence.json"

      - name: Retain integration evidence
        if: always() && hashFiles('build/integration-evidence.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kjv-integration-${{ github.sha }}
          path: build/integration-evidence.json
          if-no-files-found: error
          retention-days: 90
